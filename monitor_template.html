<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captação de Fundos</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mut:#5d6675;--line:#e3e6ec;--acc:#cc092f;--pos:#0b7a53;--neg:#b42318;--chip:#eef0f4;--sel:#fff3f5;--peer:#7a869a;--c1:#cc092f;--c2:#2f6fdb;--c3:#e0922f;--c4:#14a38b;--c5:#8a5cd6;--c6:#d6558b;--c7:#6b8e23;--c8:#8c97ab}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--ink:#e8ebf0;--mut:#9aa4b5;--line:#272d38;--acc:#ff4d6d;--pos:#3ecf8e;--neg:#ff7a70;--chip:#222833;--sel:#2a1d24;--peer:#8c97ab;--c1:#ff4d6d;--c2:#6aa0ff;--c3:#f0b04f;--c4:#3ecfb2;--c5:#b28cff;--c6:#ff7fb0;--c7:#a6c35a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;margin:0}
.sub{color:var(--mut);font-size:12px}
main{padding:16px 20px;max-width:1500px;margin:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:7px 13px;cursor:pointer;font:inherit;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}
input[type=text]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:300px}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);cursor:pointer;font-size:12px;color:var(--mut);user-select:none;z-index:2}
th.l,td.l{text-align:left}td.l{max-width:380px;overflow:hidden;text-overflow:ellipsis}
tbody tr.c{cursor:pointer}tbody tr:hover{background:var(--sel)}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--mut)}
.tag{display:inline-block;border-radius:6px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--chip);color:var(--mut)}
.tag.G{background:var(--acc);color:#fff}.tag.M{background:color-mix(in srgb,var(--c2) 22%,transparent);color:var(--c2)}.tag.P{background:var(--chip);color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kc .t{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.kc .v{font-size:24px;font-weight:700;margin:4px 0 2px;line-height:1.15;word-break:break-word}
.kc .s{font-size:12px;color:var(--mut)}
.kc .row{display:flex;justify-content:space-between;font-size:13px;margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:950px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;margin:6px 0 10px;background:var(--chip)}
.stack i{display:block;height:100%}
.leg span{display:inline-flex;align-items:center;gap:5px;margin:0 14px 4px 0;font-size:12px;color:var(--mut)}.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.bar{display:inline-block;height:9px;border-radius:3px;background:var(--acc);vertical-align:middle;opacity:.85}
.chips span{cursor:pointer;margin:0 6px 6px 0}
svg text{fill:var(--mut);font-size:11px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.ctrl{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.doc h3{font-size:14px;margin:18px 0 6px}.doc p,.doc li{max-width:900px}.doc code,.eq{background:var(--chip);border-radius:5px;padding:1px 6px;font-family:Consolas,monospace;font-size:12.5px}
.eq{display:block;padding:8px 12px;margin:6px 0;width:fit-content}.doc table{max-width:900px}.doc td,.doc th{text-align:left;white-space:normal;cursor:default}
</style>
</head>
<body>
<div class="top">
  <h1>Captação de Fundos</h1>
  <div class="seg" id="tabs"><button data-v="p" class="on">Panorama</button><button data-v="g">Gestoras</button><button data-v="m">Como é calculado</button></div>
  <div style="display:flex;gap:8px;align-items:center"><span class="sub">Janela</span><div class="seg" id="segWin"></div></div>
  <label class="chk" title="Fundos exclusivos têm captação irregular; por padrão ficam de fora"><input type="checkbox" id="ex"> incluir exclusivos</label>
  <label class="chk" title="Fundo de cotas (FIC) investe quase todo o PL no fundo master, que também é contado. Desmarcado = soma os dois (duplica o PL)."><input type="checkbox" id="nofic" checked> sem fundos de cotas (FIC)</label>
  <div style="display:flex;gap:8px;align-items:center"><span class="sub">Tipo de fundo</span><select id="kcls" class="btn"></select></div>
  <span class="sub" id="hdr" style="margin-left:auto"></span>
</div>
<main>

<!-- ============ PANORAMA ============ -->
<div id="vP">
  <div class="cards" id="pk"></div>
  <div class="card">
    <div class="ctrl">
      <input type="text" id="pq" placeholder="Buscar gestora…">
      <div class="seg" id="porteSeg"></div>
      <button class="btn" id="pcsv" style="margin-left:auto">⬇ CSV desta lista</button>
    </div>
    <div class="scroll"><table id="ptbl"></table></div>
    <p class="sub" style="margin-bottom:0">Porte pelo PL da gestora: <b>Pequena</b> &lt; R$ 1 bi · <b>Média</b> de R$ 1 bi a R$ 10 bi · <b>Grande</b> &gt; R$ 10 bi. Captação líquida = captação − resgate na janela escolhida. Clique numa gestora para abrir o detalhe.</p>
  </div>
</div>

<!-- ============ GESTORAS ============ -->
<div id="vG" style="display:none">
  <div class="card">
    <div class="ctrl" style="margin-bottom:6px">
      <input type="text" id="gq" list="gl" placeholder="Selecione ou pesquise a gestora…" style="min-width:420px">
      <button class="btn" id="gclear">limpar</button>
    </div>
    <datalist id="gl"></datalist>
    <div class="chips" id="gtop"></div>
  </div>
  <div id="gdet"></div>
</div>

<!-- ============ METODOLOGIA ============ -->
<div id="vM" style="display:none"></div>
</main>

<script>
const DATA=/*__DADOS__*/null, M=DATA.meta, FUNDOS=DATA.fundos;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(x,d=1)=>x==null||!isFinite(x)?'–':x.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const dbr=s=>s?s.split('-').reverse().join('/'):'';
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const enc=encodeURIComponent, dec=decodeURIComponent;
const cls=x=>x==null||!isFinite(x)||x===0?'':(x>0?'pos':'neg');
const num=x=>x==null||!isFinite(x)?0:x;
const sortN=a=>a.slice().sort((x,y)=>x-y);
// média por fundo sem extremos (winsorizada 5%-95%): evita que um fundo novo com milhares de % distorça; arr deve estar ordenado
function wmean(s){if(!s.length) return null; const lo=quant(s,.05), hi=quant(s,.95); return s.reduce((a,v)=>a+Math.min(Math.max(v,lo),hi),0)/s.length;}
function quant(s,p){if(!s.length) return null; const i=(s.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo);}
// valores dos fundos vêm em R$ mil
const mi=x=>x==null?'–':nf(x/1e3,1);                    // R$ mil -> R$ mi
const bi=x=>x==null?'–':nf(x/1e6,2);                    // R$ mil -> R$ bi
const brl=x=>x==null?'–':'R$ '+Math.round(x*1000).toLocaleString('pt-BR'); // R$ mil -> R$ inteiro, sem abreviar
const pct=(x,d=2)=>x==null||!isFinite(x)?'–':nf(x,d)+'%';

// ---- classificação
const porteG=pl=>pl<1e6?'P':pl<1e7?'M':'G';                         // gestora: <1 bi pequena, <10 bi média, >=10 bi grande
const nomeG={P:'Pequena',M:'Média',G:'Grande'};
const porteF=pl=>pl<1e5?'P':pl<1e6?'M':'G';                         // fundo: <100 mi pequeno, <1 bi médio, >=1 bi grande
const nomeF={P:'Pequeno',M:'Médio',G:'Grande'};
const tag=(p,nome=nomeG)=>`<span class="tag ${p}">${nome[p]}</span>`;
const MINPL=5000, MINPEERS=5;                                       // PL mínimo (R$ mil) p/ entrar nos % por fundo e nº mínimo de peers

const st={w:2,tab:'p',ex:false,nofic:true,k:'',psort:'pl',pdir:-1,porte:'',gsel:null,fsort:'pl',fdir:-1};
const U=()=>FUNDOS.filter(f=>(st.ex||!f.ex)&&(!st.nofic||f.fc!=='S')&&(!st.k||f.k===st.k));

function aggF(fs,w){
  let F=0,P=0,C=0,R=0,n=0,ent=0,pl=0;
  fs.forEach(f=>{pl+=f.pl; if(f.P0[w]>0){F+=num(f.F[w]);P+=f.P0[w];C+=num(f.C[w]);R+=num(f.R[w]);n++; if(f.F[w]>0) ent++;}});
  return {nf:fs.length,n,pl,F,P,C,R,ent,pct:P>0?F/P*100:null};
}
const heat=(v,cap)=>{if(v==null||!isFinite(v)||v===0) return 'transparent'; const a=Math.min(Math.abs(v)/cap,1)*.34; return v>0?`rgba(16,160,110,${a.toFixed(2)})`:`rgba(224,56,44,${a.toFixed(2)})`;};

function gestoras(){
  const by=new Map(); U().forEach(f=>{(by.get(f.g)||by.set(f.g,[]).get(f.g)).push(f);});
  const rows=[...by].map(([g,fs])=>{const a=aggF(fs,st.w); return {g,fs,...a,porte:porteG(a.pl)};});
  rows.sort((a,b)=>b.pl-a.pl).forEach((r,i)=>r.rankPL=i+1);
  return rows;
}

// ---------- controles
function build(){
  $('hdr').textContent=`Dados até ${dbr(M.ultima)} · gerado em ${M.gerado}`;
  $('segWin').innerHTML=M.janelas.map((j,i)=>`<button data-i="${i}" title="base: ${dbr(M.bases[i])}">${j}</button>`).join('');
  $('segWin').onclick=e=>{const b=e.target.closest('button'); if(b){st.w=+b.dataset.i; render();}};
  $('tabs').onclick=e=>{const b=e.target.closest('button'); if(b) setTab(b.dataset.v);};
  $('ex').onchange=()=>{st.ex=$('ex').checked; render();};
  $('nofic').onchange=()=>{st.nofic=$('nofic').checked; render();};
  const ks=[...new Set(FUNDOS.map(f=>f.k))].sort();
  $('kcls').innerHTML='<option value="">Todos os tipos</option>'+ks.map(k=>`<option>${esc(k)}</option>`).join('');
  $('kcls').onchange=()=>{st.k=$('kcls').value; render();};
  $('pq').oninput=renderPanorama;
  $('pcsv').onclick=csvPanorama;
  $('gq').oninput=()=>{const v=$('gq').value; if(GR&&GR.some(r=>r.g===v)){st.gsel=v; renderGest();}};
  $('gclear').onclick=()=>{$('gq').value=''; st.gsel=null; renderGest();};
}
function setTab(v){
  st.tab=v; $('vP').style.display=v==='p'?'':'none'; $('vG').style.display=v==='g'?'':'none'; $('vM').style.display=v==='m'?'':'none';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  render(); window.scrollTo(0,0);
}
function openG(g){st.gsel=g; $('gq').value=g; setTab('g');}
let GR=null;
function render(){
  document.querySelectorAll('#segWin button').forEach(b=>b.classList.toggle('on',+b.dataset.i===st.w));
  GR=gestoras();
  if(st.tab==='p') renderPanorama(); else if(st.tab==='g') renderGest(); else renderMetodo();
}

// ================= PANORAMA =================
function renderPanorama(){
  const w=st.w, j=M.janelas[w], rows=GR;
  const tot=aggF(U(),w), q=norm($('pq').value);
  const cnt={P:0,M:0,G:0}; rows.forEach(r=>cnt[r.porte]++);
  $('pk').innerHTML=`<div class="kc"><div class="t">Gestoras</div><div class="v">${rows.length}</div><div class="s">Grandes ${cnt.G} · Médias ${cnt.M} · Pequenas ${cnt.P}</div></div>
   <div class="kc"><div class="t">PL total</div><div class="v">R$ ${bi(tot.pl)} bi</div><div class="s">${tot.nf.toLocaleString('pt-BR')} fundos (classes)</div></div>
   <div class="kc"><div class="t">Captação líquida ${j}</div><div class="v ${cls(tot.F)}">R$ ${nf(tot.F/1e3,0)} mi</div><div class="s">${pct(tot.pct)} do PL inicial · base ${dbr(M.bases[w])}</div></div>
   <div class="kc"><div class="t">Gestoras com captação positiva</div><div class="v">${nf(rows.filter(r=>r.F>0).length/Math.max(rows.length,1)*100,0)}%</div><div class="s">${rows.filter(r=>r.F>0).length} de ${rows.length}</div></div>`;
  $('porteSeg').innerHTML=[['','Todas ('+rows.length+')'],['G','Grandes ('+cnt.G+')'],['M','Médias ('+cnt.M+')'],['P','Pequenas ('+cnt.P+')']].map(([k,n])=>`<button data-k="${k}" class="${st.porte===k?'on':''}">${n}</button>`).join('');
  $('porteSeg').onclick=e=>{const b=e.target.closest('button'); if(b){st.porte=b.dataset.k; renderPanorama();}};
  let list=rows.filter(r=>(!st.porte||r.porte===st.porte)&&(!q||norm(r.g).includes(q)));
  const key=st.psort, val=r=>key==='g'?r.g:key==='porte'?r.pl:r[key];
  list.sort((a,b)=>{const x=val(a),y=val(b); if(x==null) return 1; if(y==null) return -1; return (typeof x==='string'?x.localeCompare(y):x-y)*st.pdir;});
  st.plist=list;
  const cap=quant(sortN(rows.map(r=>Math.abs(r.F))),.92)||1, capP=quant(sortN(rows.map(r=>Math.abs(r.pct||0))),.92)||1;
  const C=[['#','rankPL'],['Gestora','g'],['Porte','porte'],['PL (R$ bi)','pl'],[`Captação líquida ${j} (R$ mi)`,'F'],['% do PL inicial','pct']];
  $('ptbl').innerHTML='<thead><tr>'+C.map(([n,k])=>`<th data-k="${k}" class="${k==='g'||k==='porte'?'l':''}">${n}${st.psort===k?(st.pdir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
   list.map(r=>`<tr class="c" data-g="${enc(r.g)}"><td class="mut">${r.rankPL}</td><td class="l" title="${esc(r.g)}">${esc(r.g)}</td><td class="l">${tag(r.porte)}</td><td>${bi(r.pl)}</td>
     <td class="${cls(r.F)}" style="background:${heat(r.F,cap)}">${mi(r.F)}</td><td class="${cls(r.pct)}" style="background:${heat(r.pct,capP)}">${pct(r.pct)}</td></tr>`).join('')+'</tbody>';
  $('ptbl').querySelector('thead').onclick=e=>{const th=e.target.closest('th'); if(!th) return; const k=th.dataset.k; if(st.psort===k) st.pdir*=-1; else {st.psort=k; st.pdir=k==='g'?1:-1;} renderPanorama();};
  $('ptbl').querySelector('tbody').onclick=e=>{const tr=e.target.closest('tr'); if(tr) openG(dec(tr.dataset.g));};
}
function dl(nome,linhas){
  const q=x=>`"${String(x??'').replace(/"/g,'""')}"`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+linhas.map(l=>l.map(q).join(';')).join('\n')],{type:'text/csv'}));
  a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}
const cn=x=>x==null?'':String(x).replace('.',',');
function csvPanorama(){
  const j=M.janelas[st.w];
  dl(`gestoras_${j}_${M.ultima}.csv`,[['Gestora','Porte','PL_R$','Captacao_liquida_R$_'+j,'Pct_PL_inicial']].concat(st.plist.map(r=>[r.g,nomeG[r.porte],cn(r.pl*1000),cn(r.F*1000),cn(r.pct)])));
}

// ================= GESTORAS =================
function renderGest(){
  const w=st.w, j=M.janelas[w];
  $('gl').innerHTML=GR.map(r=>`<option value="${esc(r.g)}">`).join('');
  $('gtop').innerHTML=st.gsel?'':'<div class="sub" style="margin-bottom:6px">Maiores por PL:</div>'+GR.slice(0,14).map(r=>`<span class="tag" onclick="openG(decodeURIComponent('${enc(r.g)}'))">${esc(r.g.length>34?r.g.slice(0,34)+'…':r.g)}</span>`).join('');
  const me=st.gsel&&GR.find(r=>r.g===st.gsel);
  if(!me){$('gdet').innerHTML='<div class="card empty">Escolha uma gestora na busca acima ou clique numa linha do Panorama.</div>'; return;}
  detalheGest(me,j);
}

function scaleY(vals,h,pad){const a=vals.filter(v=>v!=null&&isFinite(v)); let lo=Math.min(0,...a),hi=Math.max(0,...a); if(hi===lo){hi=1;lo=-1;} const sp=hi-lo; lo-=sp*.05; hi+=sp*.05; return {lo,hi,y:v=>pad+(hi-v)/(hi-lo)*(h-2*pad)};}
function svgBars(labels,vals,fx,fv,colorFn){
  const W=520,H=230,L=54,B=34,n=labels.length, sc=scaleY(vals,H-B,10), bw=(W-L)/n, step=Math.ceil(n/8);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let i=0;i<=4;i++){const v=sc.lo+(sc.hi-sc.lo)*i/4, y=sc.y(v); s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+3}" text-anchor="end">${nf(v,Math.abs(sc.hi-sc.lo)<10?1:0)}</text>`;}
  const y0=sc.y(0); s+=`<line x1="${L}" x2="${W}" y1="${y0}" y2="${y0}" stroke="var(--mut)"/>`;
  labels.forEach((m,i)=>{const v=vals[i], x=L+i*bw; if(v!=null){const y=sc.y(v); s+=`<rect x="${x+bw*.12}" width="${bw*.76}" y="${Math.min(y,y0)}" height="${Math.max(Math.abs(y-y0),.5)}" fill="${colorFn?colorFn(v,i):(v<0?'var(--neg)':'var(--pos)')}"><title>${fx(m)}: ${fv(v)}</title></rect>`;}
    if(i%step===0) s+=`<text x="${x+bw/2}" y="${H-B+14}" text-anchor="middle">${fx(m)}</text>`;});
  return s+'</svg>';
}
function svgLines(labels,series,fx,fv){
  const W=520,H=230,L=54,B=34,n=labels.length, all=series.flatMap(s=>s.v), sc=scaleY(all,H-B,10), x=i=>L+i*(W-L-6)/Math.max(n-1,1);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let i=0;i<=4;i++){const v=sc.lo+(sc.hi-sc.lo)*i/4, y=sc.y(v); s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+3}" text-anchor="end">${nf(v,Math.abs(sc.hi-sc.lo)<10?1:0)}</text>`;}
  series.forEach(se=>{let d='',pen=false; se.v.forEach((v,i)=>{if(v==null||!isFinite(v)){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+' '+sc.y(v).toFixed(1); pen=true;});
    s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2"/>`;});
  const step=Math.ceil(n/6); labels.forEach((m,i)=>{if(i%step===0||i===n-1) s+=`<text x="${x(i)}" y="${H-B+14}" text-anchor="middle">${fx(m)}</text>`;});
  return s+'</svg>';
}
const fm=m=>m.length===7?m.slice(5)+'/'+m.slice(2,4):m, fd=d=>dbr(d).slice(0,5);

function detalheGest(me,j){
  const w=st.w, fs=me.fs, g=me.g, u=U();
  // universo de peers por (classe, público) e mercado sem a gestora
  const outras=u.filter(f=>f.g!==g), elOut=outras.filter(f=>f.P0[w]>=MINPL&&f.F[w]!=null);
  const mktAgg=aggF(outras,w);
  const idx=new Map(); u.forEach(f=>{if(f.P0[w]>=MINPL&&f.F[w]!=null){const k=f.a+'|'+f.pa; (idx.get(k)||idx.set(k,[]).get(k)).push(f.F[w]/f.P0[w]*100);}});
  idx.forEach((v,k)=>idx.set(k,sortN(v)));
  const fpct=f=>f.P0[w]>=MINPL&&f.F[w]!=null?f.F[w]/f.P0[w]*100:null;
  const medMkt=wmean(sortN(elOut.map(f=>f.F[w]/f.P0[w]*100)));
  const medMe=wmean(sortN(fs.map(fpct).filter(v=>v!=null)));
  const nG={P:0,M:0,G:0}; fs.forEach(f=>nG[porteF(f.pl)]++);

    <div class="scroll"><table id="ftbl"><thead><tr>${[['n','Fundo','l'],['a','Classe ANBIMA','l'],['k','Classe CVM','l'],['porte','Porte','l'],['pl','PL (R$ mi)'],['shr','% do PL da gestora'],['F',`Capt. líq. ${j} (R$ mi)`],['v','% PL captação'],['pm','Peers (média)'],['spr','Spread (pp)']].map(([k,n,l])=>`<th data-k="${k}" class="${l||''}">${n}${st.fsort===k?(st.fdir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>

// ================= COMO É CALCULADO (por tabela) =================
function renderMetodo(){

  const ex=ref?`<div class="card" style="background:var(--bg)"><b>Exemplo com números reais — ${esc(ref.g)}, janela ${j} (base ${dbr(M.bases[w])}):</b>
    <p style="margin:6px 0 0">Captação bruta R$ ${mi(ref.C)} mi − resgates R$ ${mi(ref.R)} mi = <b>captação líquida R$ ${mi(ref.F)} mi</b>.<br>
    Os mesmos fundos tinham R$ ${mi(ref.P)} mi de PL na data-base → ${mi(ref.F)} ÷ ${mi(ref.P)} × 100 = <b>${pct(ref.pct)}</b> do PL inicial.<br>
    PL atual (soma dos fundos): ${brl(ref.pl)} = R$ ${bi(ref.pl)} bi → porte <b>${nomeG[ref.porte]}</b>.</p></div>`:'';
  $('vM').innerHTML=`<div class="card doc"><h2>Como cada número é calculado</h2>
  <p class="sub">Dados abertos da CVM. Valores em R$; nas telas “mi” = milhões e “bi” = bilhões. Abaixo: primeiro os conceitos comuns, depois <b>cada tabela da tela, coluna por coluna</b>.</p>${ex}

  <h3>A. Conceitos comuns</h3>
  <ul>
  <li><b>Fontes:</b> <i>Informe Diário de Fundos</i> (captação, resgate, PL, cotistas por fundo e dia; defasagem de 1 a 2 dias — último dado ${dbr(M.ultima)}) e <i>Registro de Fundo/Classe</i> (nome, gestora, administrador, classe CVM, classe ANBIMA, público-alvo, exclusivo, fundo de cotas).</li>
  <li><b>Quais fundos entram:</b> todas as classes de fundos com informe diário (fundos de investimento financeiro): <b>Multimercado, Renda Fixa, Ações, Cambial e FMP-FGTS</b>, em funcionamento normal, com informe nos últimos 5 pregões e PL &gt; 0. <b>Fundos fora do Informe Diário</b> (FIDC, FII, FIP, FIAGRO) <b>não têm captação diária e não entram</b>.</li>
  <li><b>Filtros do topo:</b> “<i>sem exclusivos</i>” (padrão: ligado) tira fundos de cotista único — captam/resgatam em blocos e distorcem. “<i>sem fundos de cotas (FIC)</i>” (padrão: ligado) tira os fundos que investem quase todo o PL em outro fundo (o master), que também está na base: somar os dois contaria o mesmo dinheiro duas vezes. “<i>Tipo de fundo</i>” restringe a uma classe CVM.</li>
  <li><b>Gestora</b> = nome no cadastro da CVM. Classes com subclasses são somadas numa só linha (por CNPJ da classe).</li>
  <li><b>Janela e data-base:</b> a janela soma a captação do pregão seguinte à data-base até ${dbr(M.ultima)}; a data-base é onde se mede o <b>PL inicial</b>. Janelas em dias contam pregões; MTD/YTD partem do último pregão do mês/ano anterior.<br>
  <table style="margin:6px 0"><thead><tr><th>Janela</th><th>Data-base</th></tr></thead><tbody>${M.janelas.map((x,i)=>`<tr ${i===w?'style="background:var(--sel)"':''}><td><b>${x}</b></td><td>${dbr(M.bases[i])}</td></tr>`).join('')}</tbody></table></li>
  <li><b>Captação líquida</b> = Σ (captação do dia − resgate do dia) na janela. Positivo = entrada; negativo = saída.</li>
  <li><b>% do PL inicial</b> = captação líquida ÷ PL na data-base × 100. Para um grupo de fundos: Σ captação líquida ÷ Σ PL inicial (= média ponderada pelo PL).</li>
  <li><b>Só entram nessas contas fundos com PL &gt; 0 na data-base</b>; fundos criados dentro da janela ficam de fora (da gestora e do mercado).</li>
  <li><b>Porte da gestora</b> (pelo PL atual): Pequena &lt; R$ 1 bi · Média de R$ 1 bi a R$ 10 bi · Grande ≥ R$ 10 bi. <b>Porte do fundo:</b> Pequeno &lt; R$ 100 mi · Médio de R$ 100 mi a R$ 1 bi · Grande ≥ R$ 1 bi.</li>
  <li><b>Média por fundo</b> = média simples dos % PL de cada fundo (PL inicial ≥ R$ 5 mi), com extremos limitados aos percentis 5 e 95 (para um fundo novo que “captou” milhares de % não distorcer).</li>
  <li><b>Peers de um fundo</b> = outros fundos da <b>mesma classe ANBIMA e mesmo público-alvo</b> (mínimo de 5), exceto ele próprio.</li>
  </ul>

  ${T('Tabela “Gestoras”','aba Panorama',[
   ['# (posição)','Ordem decrescente do PL atual entre as gestoras do universo filtrado.'],
   ['Gestora','Nome no cadastro da CVM.'],
   ['Porte','Pelo PL atual: Pequena &lt; R$ 1 bi · Média até R$ 10 bi · Grande ≥ R$ 10 bi.'],
   ['PL (R$ bi)','Σ do PL atual (último pregão) de todos os fundos da gestora no universo, ÷ 1.000.000.000.'],
   ['Captação líquida (R$ mi)','Σ (captação − resgate) dos fundos da gestora na janela escolhida, ÷ 1.000.000. Só fundos com PL &gt; 0 na data-base.'],
   ['% do PL inicial','Captação líquida da gestora ÷ Σ PL dos mesmos fundos na data-base × 100 (média ponderada).'],
   ['Cor das células','Verde = entrada, vermelho = saída; intensidade proporcional ao valor, limitada ao percentil 92 das gestoras (para um extremo não apagar o resto).'],
   ['Cards do topo','<b>Gestoras</b>: contagem por porte. <b>PL total</b>: Σ PL atual de todos os fundos. <b>Captação líquida</b>: Σ de todas as gestoras (e % sobre o PL inicial somado). <b>Gestoras com captação positiva</b>: % de gestoras com captação líquida &gt; 0.']])}

  ${T('Cards da gestora','aba Gestoras, topo',[
   ['PL total','Σ PL atual dos fundos da gestora (R$ inteiros, sem abreviar) e a posição (#) por PL entre as gestoras.'],
   ['Porte da gestora','Regra do porte acima, sobre o PL atual.'],
   ['Fundos grandes','Quantidade de fundos da gestora com PL atual ≥ R$ 1 bi; abaixo, a contagem de médios (R$ 100 mi – 1 bi) e pequenos (&lt; R$ 100 mi).'],
   ['Captação líquida','Σ (captação − resgate) na janela; “entradas” = Σ captação, “saídas” = Σ resgates; % = líquida ÷ Σ PL inicial.'],
   ['Gestora (média ponderada)','% PL inicial da gestora: Σ captação líquida ÷ Σ PL inicial.'],
   ['Mercado','Mesma conta com todos os fundos do universo <b>exceto os da gestora</b>.'],
   ['Média por fundo: gestora / mercado','Média simples (sem extremos) dos % PL de cada fundo da gestora / dos fundos das demais gestoras.'],
   ['“Acima/abaixo do mercado”','% PL da gestora − % PL do mercado, em pontos percentuais (p.p.).']])}

  ${T('Tabela “Fundos da gestora”','aba Gestoras',[
   ['Fundo / Classe ANBIMA / Classe CVM','Cadastro da CVM (classe de cotas).'],
   ['Porte','Pelo PL atual do fundo: Pequeno &lt; R$ 100 mi · Médio até R$ 1 bi · Grande ≥ R$ 1 bi.'],
   ['PL (R$ mi)','PL do fundo no último pregão, ÷ 1.000.000.'],
   ['% do PL da gestora','PL do fundo ÷ PL total da gestora (mesmo universo filtrado) × 100.'],
   ['Captação líquida (R$ mi)','Σ (captação − resgate) do fundo na janela.'],
   ['% PL captação','Captação líquida do fundo ÷ PL do fundo na data-base × 100 (só se PL inicial ≥ R$ 5 mi).'],
   ['Peers (média)','Média (sem extremos, percentis 5–95) do % PL dos peers do fundo (mesma classe ANBIMA e público-alvo, sem o próprio fundo; precisa de ≥ 5).'],
   ['Spread (pp)','% PL captação do fundo − Peers (média). Positivo = captando mais que os peers.']])}

  ${T('Tabela “PL por classe CVM”','aba Gestoras',[
   ['Classe CVM','Multimercado, Renda Fixa, Ações, Cambial ou FMP-FGTS (classificação do registro da CVM).'],
   ['Fundos / PL (R$ mi)','Quantidade e Σ PL atual dos fundos da gestora nessa classe.'],
   ['% do PL da gestora','PL da classe ÷ PL total da gestora × 100.'],
   ['Capt. líq. (R$ mi) / % PL gestora','Σ captação líquida da gestora na classe; ÷ Σ PL inicial dessa classe na gestora.'],
   ['% PL mercado na classe','Mesma conta com os fundos <b>das demais gestoras</b> na mesma classe CVM.'],
   ['Dif. (pp)','% PL gestora − % PL mercado na classe.']])}

  ${T('Tabela “PL por classe ANBIMA (linha)”','aba Gestoras',[
   ['Linha (classe ANBIMA)','Classificação ANBIMA do cadastro (ex.: Multimercados Livre, Renda Fixa Duração Baixa Soberano…).'],
   ['Fundos / PL (R$ mi) / % do PL da gestora','Igual à tabela por classe CVM, agora por linha ANBIMA.'],
   ['Capt. líq. / % PL gestora / % PL mercado na linha / Dif.','Mesmas contas, restritas à linha; mercado = fundos das demais gestoras na mesma linha.'],
   ['Média por fundo: gestora / mercado','Média simples (sem extremos) dos % PL por fundo na linha, da gestora e das demais gestoras.']])}

  ${T('Gráficos da gestora','aba Gestoras',[
   ['Captação líquida mensal (R$ mi)','Σ da captação líquida de todos os fundos da gestora em cada mês (o último é o mês corrente, parcial).'],
   ['Evolução do PL (R$ bi)','Σ do PL de cada fundo no último pregão do mês anterior (“início do mês”); a última barra é o PL atual.'],
   ['Captação líquida diária (R$ mi)',`Σ por dia nos últimos ${M.datas_diarias.length} pregões.`],
   ['Captação acumulada (% PL)',`Soma acumulada da captação diária ÷ Σ PL de ${M.datas_diarias.length} pregões atrás dos mesmos fundos; comparada à das demais gestoras (calculada do mesmo jeito).`]])}

  <h3>B. Tabelas exportadas</h3>
  <p>A aba <b>Exportações</b> traz as mesmas contas, completas e em R$ inteiros, em CSV, Excel e Parquet — o dicionário de cada coluna está em <code>EXPORTACOES.md</code> (também copiado para <code>exportacoes/README.md</code>). Nas tabelas por gestora, a coluna <code>universo</code> diz o filtro usado: <code>todos</code>, <code>sem_exclusivos</code> ou <code>sem_cotas</code> (o padrão desta tela é sem exclusivos <b>e</b> sem FIC).</p>

  <h3>C. Limitações</h3>
  <ul><li>Só fundos com Informe Diário (FIF). FIDC, FII, FIP e FIAGRO não têm captação diária e ficam de fora.</li>
  <li>Dados com 1 a 2 dias de defasagem; PL com precisão de R$ 100 (guardado em R$ mil com uma casa decimal).</li>
  <li>Fundos exclusivos e FIC ficam fora por padrão; ligar/desligar muda os totais (a tela recalcula tudo).</li>
  <li>A gestora é identificada pelo nome do cadastro; grafias diferentes aparecem como gestoras separadas.</li></ul></div>`;
